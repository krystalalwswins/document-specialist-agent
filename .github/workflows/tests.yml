name: Learning runtime tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-mcp.txt
      - run: python -m pytest -q
      - run: python -m demo.learning_demo
      - run: python -m evaluation.run
